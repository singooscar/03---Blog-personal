<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <meta
      name="description"
      content="Ponte en contacto con el creador del blog para consultas o colaboraciones."
    >
    <title>Contacto | Blog de Oscar</title>
  </head>
  <body>
    <header>
      <h1>Contacto</h1>
      <p>Hola</p>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="articulo-1.html">Artículo 1</a></li>
          <li><a href="articulo-2.html">Artículo 2</a></li>
          <li><a href="sobre-mi.html">Sobre mí</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Contacto</h2>
      <p>¿Tienes una pregunta o una propuesta? Escríbeme.</p>
      <form>
        <p>
          <label for="nombre">Nombre:</label><br>
          <input type="text" id="nombre" name="nombre" required >
        </p>
        <p>
          <label for="correo">Correo electrónico:</label><br >
          <input type="email" id="correo" name="correo" required >
        </p>
        <p>
          <label for="asunto">Asunto:</label><br >
          <select id="asunto" name="asunto">
            <option>Consulta</option>
            <option>Colaboración</option>
            <option>Otro</option>
          </select>
        </p>
        <p>
          <label for="mensaje">Mensaje:</label><br >
          <textarea
            id="mensaje"
            name="mensaje"
            rows="5"
            cols="40"
            required
          ></textarea>
        </p>
        <p><button type="submit">Enviar</button></p>
      </form>
    </main>
    <footer>
      <p>&copy;2026 Oscar Singo, Todos los derechos reservados</p>
      <p>
        Última actualización:
        <time datetime="2026-10-30">30 de octubre de 2026</time>
      </p>
    </footer>
  </body>
